services:
  # Igual que docker-compose.yml pero construyendo las imágenes desde el código local
  # (para desarrollo/pruebas antes de pushear). Uso: ./iniciar-motos.sh
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: motos-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
      - MSSQL_PID=Express
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: motos-db-init
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SA_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./src/ApiMotos/Scripts:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/init-db.sh"]
    restart: "no"

  api:
    build:
      # Contexto = raíz del repo (el Dockerfile hace COPY src/ApiMotos/...).
      context: .
      dockerfile: src/ApiMotos/Dockerfile
    container_name: motos-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=db;Database=AppDB;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - ConnectionStrings__MasterConnection=Server=db;Database=master;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
    ports:
      - "5309:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: motos-frontend
    ports:
      - "8092:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mssql-data:
