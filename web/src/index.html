<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Motos — Logística</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- PWA (plan Etapa F1, 2026-09-12): instalable en el celular. El manifest y los íconos
       viven en public/; el service worker solo se registra en el build de producción. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#111827">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Motos">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- CESKIA 2.0: Inter (UI) + Inter Tight (display) + JetBrains Mono (ids/códigos).
       Antes se cargaba Roboto y los tokens declaraban Inter: todo caía al fallback. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Piel Salud 2026-08-29: Material Symbols Outlined (trazo fino 300) reemplaza a
       Material Icons — mismos nombres/ligaduras, iconografía más liviana. -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
