<div class="dashboard-container">
  <header class="dashboard-header">
    <h1 class="greeting">🌙 {{ greeting }}, {{ userName }}</h1>
    <p class="subtitle">Bienvenido al panel de control</p>
  </header>

  <div class="dashboard-cards">
    <mat-card class="dashboard-card">
      <mat-card-header>
        <mat-card-title>Ventas del día</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <span class="card-value">$12,450</span>
      </mat-card-content>
    </mat-card>

    <mat-card class="dashboard-card">
      <mat-card-header>
        <mat-card-title>Pedidos</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <span class="card-value">47</span>
      </mat-card-content>
    </mat-card>

    <mat-card class="dashboard-card">
      <mat-card-header>
        <mat-card-title>Clientes nuevos</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <span class="card-value">12</span>
      </mat-card-content>
    </mat-card>
  </div>
</div>
