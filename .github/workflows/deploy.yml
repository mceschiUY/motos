name: Deploy
on:
  push:
    branches: [main]
concurrency:
  group: deploy-motos
  cancel-in-progress: false
jobs:
  build:                          # corre en la nube de GitHub → no carga el server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/ApiMotos/Dockerfile
          push: true
          tags: |
            ghcr.io/mceschiuy/motos-backend:${{ github.sha }}
            ghcr.io/mceschiuy/motos-backend:latest
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: web/Dockerfile
          push: true
          tags: |
            ghcr.io/mceschiuy/motos-frontend:${{ github.sha }}
            ghcr.io/mceschiuy/motos-frontend:latest
  deploy:                         # corre en el runner self-hosted (label: lab)
    needs: build
    runs-on: [self-hosted, linux, lab]
    steps:
      - uses: actions/checkout@v4     # solo para tener el docker-compose.yml
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker compose -p motos pull
          docker compose -p motos up -d
      - name: Health check
        run: |
          sleep 20
          curl -fsS http://localhost:8092/ >/dev/null || (echo "Frontend caído" && exit 1)
      - name: Limpiar imágenes viejas
        run: docker image prune -f
